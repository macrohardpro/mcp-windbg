[package]
name = "mcp-windbg-rs"
version = "0.4.0"
edition = "2021"
authors = ["MCP WinDbg Contributors"]
description = "A high-performance Model Context Protocol server for Windows crash dump analysis"
license = "AGPL-3.0-or-later"
repository = "https://github.com/yourusername/mcp-windbg-rs"

[[bin]]
name = "mcp-windbg-rs"
path = "src/main.rs"

[[bin]]
name = "web-dump-debugger"
path = "src/bin/web_dump_debugger.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "0.8.5", features = ["transport-io", "server"] }

# HTTP server dependencies
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# Archive extraction dependencies
zip = "2.2"
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1.0"

# Markdown rendering dependencies
pulldown-cmark = "0.12"
syntect = "5.2"

# Configuration dependencies
toml = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
